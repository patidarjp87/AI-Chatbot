# ==================================================================
# settings.yaml - TECHNICAL SETTINGS
# To switch a provider, change the "provider:" line in that section.
# Keys are NOT stored here; only the NAME of the environment variable.
# ==================================================================

project:
  name: digital_samajh
  language: hi              # language code sent to YouTube (hi = Hindi)
  timezone: Asia/Kolkata

# ---------- Video format and quality ----------
video:
  format: shorts            # shorts | long
  fps: 30
  formats:
    shorts: { width: 1080, height: 1920, max_seconds: 59 }
    long:   { width: 1920, height: 1080, max_seconds: 480 }
  scene_seconds_min: 3      # used in the AI prompt: about how long one scene lasts
  scene_seconds_max: 6
  layout: default           # file name in src/video/layouts/ (without .py)
  text_engine: auto         # auto | harfbuzz | pillow. Hindi needs harfbuzz (auto uses it when installed)

# ---------- Step 1: topic / news ----------
news:
  provider: evergreen       # evergreen = hand-written topic list (Phase 1 TEST only) | rss
  max_items: 10
  evergreen:
    topics_file: config/topics_evergreen.yaml
    pick: rotate            # rotate = a different topic each day | random
    topic_id: ""            # type a topic id here to force that topic while testing
  rss:
    feeds:
      - https://feeds.bbci.co.uk/news/world/rss.xml
      - https://www.aljazeera.com/xml/rss/all.xml

# ---------- Step 2: script + scene plan ----------
script:
  provider: gemini          # sample (no key) | gemini
  speaking_rate_wpm: 125    # Hindi narration runs at about 125-135 words per minute
  script_prompt_file: config/prompts/script_prompt.txt
  scene_prompt_file: config/prompts/scene_plan_prompt.txt
  force_structure: ""       # type a structure name below to force it while testing
  # The script structure rotates by date, so videos do not all follow the same pattern.
  structures:
    - name: scenario
      instruction: "Realistic everyday scenario. Open with a short situation the viewer can picture (for example 'Imagine your phone rings...'), then explain what is really happening and what to do."
    - name: myth_vs_fact
      instruction: "Myth versus fact. State a common wrong belief, then the correct fact, then why the difference matters in daily life."
    - name: three_signs
      instruction: "Three warning signs. Name exactly three clear signs, then give one action the viewer should take."
    - name: how_it_works
      instruction: "How it works. Explain the mechanism step by step with one simple everyday comparison, then why it matters to the viewer."
    - name: mistakes
      instruction: "Mistakes to avoid. Describe two or three common mistakes, why each is risky, and the safe habit to use instead."
    - name: step_by_step
      instruction: "Step-by-step guide. Give a short sequence of actions the viewer can do on their own phone, in order."
    - name: question_surprise
      instruction: "A question followed by a surprising explanation. Open with a curious question, give the surprising answer, then say what it means for the viewer."
  gemini:
    # Models are tried in this order. If one is busy (503) or unavailable, the next is used.
    models:
      - gemini-3.8-flash
      - gemini-3.7-flash
      - gemini-3.6-flash
      - gemini-3.5-flash
    attempts_per_model: 2
    retry_delay_seconds: 10
    api_key_env: GEMINI_API_KEY
    temperature: 0.7

# ---------- Step 3: voiceover ----------
voice:
  provider: edge            # edge | elevenlabs | recorded
  edge:
    voice_name: hi-IN-MadhurNeural   # alternative: hi-IN-SwaraNeural
    rate: "+0%"
    pitch: "+0Hz"
  elevenlabs:               # later phase
    api_key_env: ELEVENLABS_API_KEY
    voice_id: ""
    model_id: ""
  recorded:                 # later phase: your own recording
    audio_file: inputs/voiceover.mp3

# ---------- Step 4: stock footage ----------
footage:
  provider: pixabay         # none | pixabay
  pixabay:
    api_key_env: PIXABAY_API_KEY
    quality: large          # large | medium | small. Lower = faster downloads, softer picture
    max_file_mb: 60
    min_seconds: 4
    cache_dir: tmp/footage

# ---------- On-camera presenter (later phase) ----------
presenter:
  enabled: false
  provider: none            # none | recorded | avatar
  cutin_every_seconds: 8
  cutin_length_seconds: 3
  recorded:
    clips_dir: assets/presenter

# ---------- Final step: what to do with the video ----------
upload:
  provider: manual          # manual (just save the file) | youtube. Keep manual for the first local test
  youtube:
    mode: private           # private | scheduled | public. Phase 1 topics must stay private
    publish_delay_hours: 3
    category_id: "27"       # 27 = Education, 28 = Science & Technology
    made_for_kids: false
    contains_synthetic_media: false
    notify_subscribers: false
    client_id_env: YOUTUBE_CLIENT_ID
    client_secret_env: YOUTUBE_CLIENT_SECRET
    refresh_token_env: YOUTUBE_REFRESH_TOKEN

output:
  dir: output
  filename_pattern: "{date}_{slug}"
  keep_intermediate_files: false

logging:
  level: INFO